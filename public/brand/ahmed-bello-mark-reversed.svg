<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="Ahmed Bello Portal Symbol Reversed">
  <title>Ahmed Bello Portal Symbol Reversed</title>
  
  <!-- Outer Arch: Thick outline in warm ivory on dark background -->
  <path
    d="M 29,84 L 29,38 A 21,21 0 0,1 71,38 L 71,84"
    stroke="#f7f3eb"
    stroke-width="3.8"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />

  <!-- Inner Arch: Thin outline in warm sand on dark background -->
  <path
    d="M 35.5,84 L 35.5,38 A 14.5,14.5 0 0,1 64.5,38 L 64.5,84"
    stroke="#d6c298"
    stroke-width="1.6"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />

  <!-- Rising Sun: Small solid sand semicircle on baseline in center -->
  <path
    d="M 41.5,84 A 8.5,8.5 0 0,1 58.5,84 Z"
    fill="#d6c298"
  />
</svg>
