<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14211a" />
      <stop offset="100%" stop-color="#0c1510" />
    </linearGradient>
    <linearGradient id="brass-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d6c298" />
      <stop offset="50%" stop-color="#f0dfb8" />
      <stop offset="100%" stop-color="#b89e6c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Outer Architectural Border -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#2e4a3b" stroke-width="2" />
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#d6c298" stroke-width="1" stroke-opacity="0.35" />

  <!-- Corner Brackets -->
  <path d="M 30,70 L 30,30 L 70,30" fill="none" stroke="#d6c298" stroke-width="3" />
  <path d="M 1130,30 L 1170,30 L 1170,70" fill="none" stroke="#d6c298" stroke-width="3" />
  <path d="M 30,560 L 30,600 L 70,600" fill="none" stroke="#d6c298" stroke-width="3" />
  <path d="M 1130,600 L 1170,600 L 1170,560" fill="none" stroke="#d6c298" stroke-width="3" />

  <!-- Portal Symbol Emblem (Left) -->
  <g transform="translate(110, 190) scale(1.65)">
    <!-- Outer Arch -->
    <path
      d="M 29,120 L 29,55 A 35,35 0 0,1 99,55 L 99,120"
      stroke="#2e4a3b"
      stroke-width="7"
      fill="none"
      stroke-linecap="butt"
    />
    <!-- Inner Arch (Brass) -->
    <path
      d="M 40,120 L 40,55 A 24,24 0 0,1 88,55 L 88,120"
      stroke="#d6c298"
      stroke-width="3.5"
      fill="none"
      stroke-linecap="butt"
    />
    <!-- Keystone Sun -->
    <path
      d="M 50,120 A 14,14 0 0,1 78,120 Z"
      fill="#d6c298"
    />
  </g>

  <!-- Content Block (Right) -->
  <g transform="translate(380, 130)">
    <!-- Eyebrow -->
    <text
      x="0"
      y="30"
      fill="#d6c298"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="16"
      font-weight="700"
      letter-spacing="4"
    >
      CANADIAN FINANCIAL EDUCATION
    </text>

    <!-- Main Title: Ahmed Bello -->
    <text
      x="0"
      y="125"
      fill="#f7f3eb"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="78"
      font-weight="400"
      letter-spacing="-1"
    >
      Ahmed Bello
    </text>

    <!-- Tagline: Financial Education for Canadians -->
    <text
      x="0"
      y="180"
      fill="#d6c298"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="32"
      font-style="italic"
    >
      Financial Education for Canadians
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="215" x2="680" y2="215" stroke="#2e4a3b" stroke-width="1.5" />

    <!-- Specific Low-Competition Question Badges -->
    <g transform="translate(0, 245)">
      <!-- Badge 1: Newcomers' First Year -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="315" height="42" rx="3" fill="#1b2d23" stroke="#2e4a3b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#d6c298" />
        <text x="36" y="26" fill="#ece6da" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
          Newcomers' First-Year Money Steps
        </text>
      </g>

      <!-- Badge 2: FHSA with Home Buyers' Plan -->
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="320" height="42" rx="3" fill="#1b2d23" stroke="#2e4a3b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#d6c298" />
        <text x="36" y="26" fill="#ece6da" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
          FHSA with the Home Buyers' Plan
        </text>
      </g>

      <!-- Badge 3: Building Canadian Credit -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="315" height="42" rx="3" fill="#1b2d23" stroke="#2e4a3b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#d6c298" />
        <text x="36" y="26" fill="#ece6da" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
          Building Credit as a Newcomer
        </text>
      </g>

      <!-- Badge 4: Term vs Permanent Insurance -->
      <g transform="translate(330, 56)">
        <rect x="0" y="0" width="320" height="42" rx="3" fill="#1b2d23" stroke="#2e4a3b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#d6c298" />
        <text x="36" y="26" fill="#ece6da" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
          Term vs Permanent Life Insurance
        </text>
      </g>
    </g>

    <!-- Footer URL -->
    <text
      x="0"
      y="410"
      fill="#d6c298"
      font-family="-apple-system, BlinkMacSystemFont, sans-serif"
      font-size="18"
      font-weight="600"
      letter-spacing="1"
    >
      www.ahmedbello.com
    </text>
  </g>
</svg>
