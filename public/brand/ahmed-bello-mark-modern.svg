  <defs>
    <style>
      .forest { fill: #2e4a3b; }
      .brass { fill: #75581f; }
    </style>
  </defs>
  <!-- Left ascending structural pier -->
  <path class="forest" d="M6.0 42.0 L10.5 42.0 L22.8 14.0 L18.2 14.0 Z" />
  <!-- Right ascending structural pier -->
  <path class="forest" d="M37.5 42.0 L42.0 42.0 L29.8 14.0 L25.2 14.0 Z" />
